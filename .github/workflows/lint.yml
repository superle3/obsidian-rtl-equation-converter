name: Node.js build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v6
      - name: pnpm-setup
        uses: pnpm/setup@v1
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          version: 12
          install: false

      - run: pnpm ci
      - run: pnpm run build
      - run: pnpm run lint
